<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konu Karnesi — Deneme Takip Sistemi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f7f4;
    --grid:#dfe3ea;
    --ink:#1e2a4a;
    --ink-soft:#4a5578;
    --line:#c7cdda;
    --dogru:#1f9d63;
    --dogru-bg:#e2f5ea;
    --yanlis:#e2483f;
    --yanlis-bg:#fce6e4;
    --bos:#8b93a8;
    --bos-bg:#eceef3;
    --accent:#2c3e8c;
    --accent-soft:#eef0fb;
    --card:#ffffff;
    --radius:14px;
    --shadow:0 1px 2px rgba(30,42,74,.06), 0 8px 24px rgba(30,42,74,.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/28px 28px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/28px 28px,
      var(--paper);
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;}
  .app{max-width:1000px;margin:0 auto;padding:20px 16px 90px;}
  header.top{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 4px 22px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:38px;height:38px;border-radius:9px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;color:#fff;
    font-family:'Space Grotesk';font-weight:700;font-size:15px;flex-shrink:0;
  }
  .brand h1{font-size:19px;letter-spacing:-.02em;}
  .brand span{display:block;font-size:12px;color:var(--ink-soft);font-weight:500;margin-top:1px;}

  nav.tabs{
    display:flex;gap:6px;overflow-x:auto;padding:4px;margin-bottom:22px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);
  }
  nav.tabs button{
    flex:1;white-space:nowrap;border:none;background:transparent;
    padding:10px 12px;font-family:'Inter';font-weight:600;font-size:13px;
    color:var(--ink-soft);border-radius:9px;cursor:pointer;transition:.15s;
  }
  nav.tabs button.active{background:var(--accent);color:#fff;}
  nav.tabs button:not(.active):hover{background:var(--accent-soft);color:var(--accent);}

  .view{display:none;animation:fade .25s ease;}
  .view.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;box-shadow:var(--shadow);margin-bottom:16px;
  }
  .card h2{font-size:16px;margin-bottom:14px;letter-spacing:-.01em;}
  .card h2 .eyebrow{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--accent);font-weight:700;margin-bottom:4px;font-family:'JetBrains Mono';}

  .empty{
    text-align:center;padding:34px 16px;color:var(--ink-soft);
  }
  .empty b{color:var(--ink);}

  label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin:0 0 5px;}
  input[type=text],input[type=date],input[type=number],select,textarea{
    width:100%;padding:10px 11px;border:1.5px solid var(--line);border-radius:9px;
    font-family:'Inter';font-size:14px;background:#fff;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .row > div{flex:1;min-width:140px;}

  button.btn{
    font-family:'Inter';font-weight:600;font-size:13.5px;border:none;border-radius:9px;
    padding:11px 18px;cursor:pointer;transition:.15s;
  }
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:#233370;}
  .btn-ghost{background:var(--accent-soft);color:var(--accent);}
  .btn-ghost:hover{background:#e1e4f8;}
  .btn-danger{background:var(--yanlis-bg);color:var(--yanlis);}
  .btn-danger:hover{background:#f9d5d2;}
  .btn-sm{padding:6px 11px;font-size:12px;}
  button:disabled{opacity:.5;cursor:not-allowed;}

  .ledger{border:1px solid var(--line);border-radius:11px;overflow:hidden;}
  .ledger-row{
    display:grid;grid-template-columns:1fr 74px 74px 74px 70px;gap:8px;align-items:center;
    padding:10px 12px;border-bottom:1px solid var(--grid);background:#fff;
  }
  .ledger-row:last-child{border-bottom:none;}
  .ledger-row.head{background:var(--accent-soft);font-size:11px;font-weight:700;
    color:var(--accent);text-transform:uppercase;letter-spacing:.05em;padding:8px 12px;}
  .topic-name{font-size:13.5px;font-weight:600;}
  .pill-input{
    width:100%;text-align:center;border-radius:7px;border:1.5px solid transparent;
    padding:7px 4px;font-family:'JetBrains Mono';font-weight:600;font-size:13.5px;
  }
  .pill-input.d{background:var(--dogru-bg);color:var(--dogru);}
  .pill-input.y{background:var(--yanlis-bg);color:var(--yanlis);}
  .pill-input.b{background:var(--bos-bg);color:var(--bos);}
  .net-cell{font-family:'JetBrains Mono';font-weight:700;font-size:13.5px;text-align:center;}

  .subject-chip{
    display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;
    font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent);
  }

  .exam-card{cursor:default;}
  .exam-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .exam-meta{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .stat-strip{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
  .stat{background:var(--paper);border:1px solid var(--grid);border-radius:9px;padding:8px 12px;min-width:76px;text-align:center;}
  .stat b{display:block;font-family:'JetBrains Mono';font-size:16px;}
  .stat span{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .bar-label{width:150px;font-size:12.5px;font-weight:600;flex-shrink:0;text-align:right;}
  .bar-track{flex:1;height:18px;background:var(--grid);border-radius:6px;overflow:hidden;display:flex;}
  .bar-seg.d{background:var(--dogru);}
  .bar-seg.y{background:var(--yanlis);}
  .bar-seg.b{background:var(--bos);}
  .bar-pct{width:44px;font-family:'JetBrains Mono';font-size:11.5px;font-weight:600;color:var(--ink-soft);}

  .legend{display:flex;gap:16px;font-size:12px;color:var(--ink-soft);margin-bottom:16px;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .dot.d{background:var(--dogru);}.dot.y{background:var(--yanlis);}.dot.b{background:var(--bos);}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(30px);
    background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:600;
    opacity:0;transition:.25s;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.2);pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .topic-edit-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .topic-edit-row input{flex:1;}
  .icon-x{background:none;border:none;color:var(--yanlis);cursor:pointer;font-size:16px;padding:4px 8px;font-weight:700;}
  .flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}

  @media (max-width:520px){
    .ledger-row{grid-template-columns:1fr 56px 56px 56px 52px;gap:5px;padding:8px 8px;}
    .pill-input{font-size:12px;padding:6px 2px;}
    .bar-label{width:104px;font-size:11px;}
    .topic-name{font-size:12.5px;}
  }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand">
      <div class="brand-mark">KK</div>
      <div>
        <h1>Konu Karnesi</h1>
        <span>Deneme sınavı konu takip sistemi</span>
      </div>
    </div>
  </header>

  <nav class="tabs">
    <button data-view="ozet" class="active">Özet</button>
    <button data-view="ekle">Yeni Deneme</button>
    <button data-view="gecmis">Geçmiş</button>
    <button data-view="konular">Konular</button>
  </nav>

  <!-- ÖZET -->
  <div class="view active" id="view-ozet">
    <div id="ozet-content"></div>
  </div>

  <!-- YENİ DENEME -->
  <div class="view" id="view-ekle">
    <div class="card">
      <h2><span class="eyebrow">Adım 1</span>Deneme bilgileri</h2>
      <div class="row">
        <div>
          <label>Ders</label>
          <select id="ekle-subject"></select>
        </div>
        <div>
          <label>Deneme adı</label>
          <input type="text" id="ekle-name" placeholder="Örn. 7. Deneme">
        </div>
        <div>
          <label>Tarih</label>
          <input type="date" id="ekle-date">
        </div>
      </div>
    </div>
    <div class="card">
      <h2><span class="eyebrow">Adım 2</span>Konu bazlı doğru / yanlış / boş gir</h2>
      <div class="legend">
        <span><i class="dot d"></i>Doğru</span>
        <span><i class="dot y"></i>Yanlış</span>
        <span><i class="dot b"></i>Boş</span>
      </div>
      <div class="ledger" id="ekle-ledger"></div>
      <div class="stat-strip" id="ekle-totals" style="margin-top:16px;"></div>
      <div style="margin-top:18px;">
        <button class="btn btn-primary" id="ekle-save">Denemeyi kaydet</button>
      </div>
    </div>
  </div>

  <!-- GEÇMİŞ -->
  <div class="view" id="view-gecmis">
    <div id="gecmis-content"></div>
  </div>

  <!-- KONULAR -->
  <div class="view" id="view-konular">
    <div class="card">
      <h2><span class="eyebrow">Ayarlar</span>Ders ve konu yönetimi</h2>
      <div id="konular-subjects"></div>
      <div style="margin-top:16px;display:flex;gap:8px;">
        <input type="text" id="yeni-subject-name" placeholder="Yeni ders adı (örn. Fizik)">
        <button class="btn btn-ghost" id="yeni-subject-btn">Ders ekle</button>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const DEFAULT_DATA = {
  subjects: [
    {
      id: 'cografya', name: 'Coğrafya',
      topics: [
        'Coğrafi Konum','İklim ve Bitki Örtüsü','Fiziki Özellikler (Dağ, Ova, Plato, Toprak)',
        'Nüfus ve Yerleşme','Tarım','Hayvancılık','Maden ve Enerji Kaynakları','Sanayi',
        'Ulaşım','Ticaret','Turizm','Bölgeler','Beşeri Sistemler','Ekonomik Sistemler'
      ]
    },
    {
      id: 'tarih', name: 'Tarih',
      topics: [
        'İslamiyet Öncesi Türk Tarihi','İlk Türk-İslam Devletleri','Anadolu Selçuklu Devleti ve Beylikler',
        'Osmanlı Kültür ve Medeniyeti','Kuruluş Dönemi','Yükselme Dönemi','17. Yüzyıl (Duraklama)',
        '18. Yüzyıl (Gerileme)','19. Yüzyıl (Dağılma)','20. Yüzyıl','Kurtuluş Savaşı Hazırlık Dönemi',
        'I. TBMM ve Ayaklanmalar','Kurtuluş Savaşı Muharebeleri ve Antlaşmalar','Cumhuriyet Dönemi Kültür',
        'Atatürk İlkeleri, İnkılapları ve Dış Politika','Çağdaş Türk ve Dünya Tarihi'
      ]
    },
    {
      id: 'matematik', name: 'Matematik',
      topics: [
        'Temel Kavramlar','Sayı Basamakları','Bölme ve Bölünebilme','OBEB - OKEK','Rasyonel Sayılar',
        'Basit Eşitsizlikler','Mutlak Değer','Üslü Sayılar','Köklü Sayılar','Çarpanlara Ayırma',
        'Oran Orantı','Denklem Çözme','Problemler (Sayı, Kesir, Yaş, Yüzde, Kar-Zarar, Karışım, Hareket, İşçi)',
        'Kümeler','Fonksiyonlar','Polinomlar','II. Dereceden Denklemler','Permütasyon ve Kombinasyon',
        'Olasılık','İstatistik','Geometri (Üçgenler, Çokgenler)','Geometri (Çember ve Daire)',
        'Geometri (Katı Cisimler)','Analitik Geometri'
      ]
    }
  ],
  exams: []
};

let DATA = null;

function uid(){ return Math.random().toString(36).slice(2,10); }

const Store = {
  async get(key){
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  },
  async set(key, value){
    try{ localStorage.setItem(key, value); return true; }catch(e){ return false; }
  }
};

async function loadData(){
  try{
    const val = await Store.get('konu-karnesi-data');
    if(val){ DATA = JSON.parse(val); return; }
  }catch(e){}
  DATA = JSON.parse(JSON.stringify(DEFAULT_DATA));
  await saveData();
}

async function saveData(){
  const ok = await Store.set('konu-karnesi-data', JSON.stringify(DATA));
  if(!ok) showToast('Kaydedilemedi, tekrar dene');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function getSubject(id){ return DATA.subjects.find(s=>s.id===id); }
function net(d,y){ return d - y/4; }

// ---------- NAV ----------
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+btn.dataset.view).classList.add('active');
    if(btn.dataset.view==='ozet') renderOzet();
    if(btn.dataset.view==='ekle') renderEkle();
    if(btn.dataset.view==='gecmis') renderGecmis();
    if(btn.dataset.view==='konular') renderKonular();
  });
});

// ---------- ÖZET ----------
function renderOzet(){
  const wrap = document.getElementById('ozet-content');
  if(DATA.exams.length===0){
    wrap.innerHTML = `<div class="card"><div class="empty">
      <b>Henüz deneme eklenmedi.</b><br>"Yeni Deneme" sekmesinden başla.
    </div></div>`;
    return;
  }
  let html = '';
  DATA.subjects.forEach(subj=>{
    const exams = DATA.exams.filter(e=>e.subjectId===subj.id).sort((a,b)=>a.date.localeCompare(b.date));
    if(exams.length===0) return;

    const agg = {};
    subj.topics.forEach(t=>agg[t]={d:0,y:0,b:0});
    exams.forEach(e=>e.entries.forEach(en=>{
      if(!agg[en.topic]) agg[en.topic]={d:0,y:0,b:0};
      agg[en.topic].d+=en.d; agg[en.topic].y+=en.y; agg[en.topic].b+=en.b;
    }));

    const totalD = exams.reduce((s,e)=>s+e.entries.reduce((a,x)=>a+x.d,0),0);
    const totalY = exams.reduce((s,e)=>s+e.entries.reduce((a,x)=>a+x.y,0),0);
    const totalB = exams.reduce((s,e)=>s+e.entries.reduce((a,x)=>a+x.b,0),0);

    html += `<div class="card">
      <h2><span class="eyebrow">${exams.length} deneme</span>${subj.name}</h2>
      <div class="stat-strip" style="margin-bottom:18px;">
        <div class="stat"><b style="color:var(--dogru)">${totalD}</b><span>Doğru</span></div>
        <div class="stat"><b style="color:var(--yanlis)">${totalY}</b><span>Yanlış</span></div>
        <div class="stat"><b style="color:var(--bos)">${totalB}</b><span>Boş</span></div>
        <div class="stat"><b style="color:var(--accent)">${net(totalD,totalY).toFixed(1)}</b><span>Toplam Net</span></div>
      </div>
      ${Object.entries(agg).filter(([,v])=>v.d+v.y+v.b>0).sort((a,b)=>{
        const pa=a[1].d/(a[1].d+a[1].y+a[1].b||1), pb=b[1].d/(b[1].d+b[1].y+b[1].b||1);
        return pa-pb;
      }).map(([topic,v])=>{
        const total = v.d+v.y+v.b || 1;
        const pd=(v.d/total*100), py=(v.y/total*100), pb=(v.b/total*100);
        return `<div class="bar-row">
          <div class="bar-label">${topic}</div>
          <div class="bar-track">
            <div class="bar-seg d" style="width:${pd}%"></div>
            <div class="bar-seg y" style="width:${py}%"></div>
            <div class="bar-seg b" style="width:${pb}%"></div>
          </div>
          <div class="bar-pct">%${Math.round(pd)}</div>
        </div>`;
      }).join('')}
      <p class="muted-note" style="font-size:11.5px;color:var(--ink-soft);margin-top:6px;">Sıralama en zayıf konudan en güçlüye doğru gösterilir.</p>
    </div>`;
  });
  wrap.innerHTML = html;
}

// ---------- YENİ DENEME ----------
function populateSubjectSelect(sel){
  sel.innerHTML = DATA.subjects.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
}

function renderEkle(){
  const sel = document.getElementById('ekle-subject');
  populateSubjectSelect(sel);
  document.getElementById('ekle-date').valueAsDate = new Date();
  buildEkleLedger();
  sel.onchange = buildEkleLedger;
}

function buildEkleLedger(){
  const subj = getSubject(document.getElementById('ekle-subject').value);
  const ledger = document.getElementById('ekle-ledger');
  ledger.innerHTML = `<div class="ledger-row head"><div>Konu</div><div>Doğru</div><div>Yanlış</div><div>Boş</div><div>Net</div></div>` +
    subj.topics.map((t,i)=>`
      <div class="ledger-row" data-topic="${t}">
        <div class="topic-name">${t}</div>
        <input class="pill-input d" type="number" min="0" value="0" data-k="d">
        <input class="pill-input y" type="number" min="0" value="0" data-k="y">
        <input class="pill-input b" type="number" min="0" value="0" data-k="b">
        <div class="net-cell">0</div>
      </div>`).join('');
  ledger.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const row = inp.closest('.ledger-row');
      const d = +row.querySelector('[data-k=d]').value||0;
      const y = +row.querySelector('[data-k=y]').value||0;
      row.querySelector('.net-cell').textContent = net(d,y).toFixed(2);
      updateEkleTotals();
    });
  });
  updateEkleTotals();
}

function updateEkleTotals(){
  const rows = [...document.querySelectorAll('#ekle-ledger .ledger-row:not(.head)')];
  let D=0,Y=0,B=0;
  rows.forEach(r=>{
    D += +r.querySelector('[data-k=d]').value||0;
    Y += +r.querySelector('[data-k=y]').value||0;
    B += +r.querySelector('[data-k=b]').value||0;
  });
  document.getElementById('ekle-totals').innerHTML = `
    <div class="stat"><b style="color:var(--dogru)">${D}</b><span>Doğru</span></div>
    <div class="stat"><b style="color:var(--yanlis)">${Y}</b><span>Yanlış</span></div>
    <div class="stat"><b style="color:var(--bos)">${B}</b><span>Boş</span></div>
    <div class="stat"><b style="color:var(--accent)">${net(D,Y).toFixed(2)}</b><span>Net</span></div>`;
}

document.getElementById('ekle-save').addEventListener('click', async ()=>{
  const subjectId = document.getElementById('ekle-subject').value;
  const name = document.getElementById('ekle-name').value.trim() || 'İsimsiz Deneme';
  const date = document.getElementById('ekle-date').value || new Date().toISOString().slice(0,10);
  const rows = [...document.querySelectorAll('#ekle-ledger .ledger-row:not(.head)')];
  const entries = rows.map(r=>({
    topic: r.dataset.topic,
    d: +r.querySelector('[data-k=d]').value||0,
    y: +r.querySelector('[data-k=y]').value||0,
    b: +r.querySelector('[data-k=b]').value||0,
  })).filter(e=>e.d+e.y+e.b>0);
  if(entries.length===0){ showToast('En az bir konuya veri gir'); return; }
  DATA.exams.push({ id: uid(), subjectId, name, date, entries });
  await saveData();
  showToast('Deneme kaydedildi ✓');
  document.getElementById('ekle-name').value='';
  buildEkleLedger();
});

// ---------- GEÇMİŞ ----------
function renderGecmis(){
  const wrap = document.getElementById('gecmis-content');
  if(DATA.exams.length===0){
    wrap.innerHTML = `<div class="card"><div class="empty"><b>Henüz deneme yok.</b></div></div>`;
    return;
  }
  const sorted = [...DATA.exams].sort((a,b)=>b.date.localeCompare(a.date));
  wrap.innerHTML = sorted.map(exam=>{
    const subj = getSubject(exam.subjectId);
    const D = exam.entries.reduce((s,e)=>s+e.d,0);
    const Y = exam.entries.reduce((s,e)=>s+e.y,0);
    const B = exam.entries.reduce((s,e)=>s+e.b,0);
    return `<div class="card exam-card">
      <div class="exam-top">
        <div>
          <span class="subject-chip">${subj?subj.name:'?'}</span>
          <h2 style="display:inline;margin-left:8px;font-size:15px;">${exam.name}</h2>
          <div class="exam-meta">${exam.date} · ${exam.entries.length} konu</div>
        </div>
        <button class="btn btn-danger btn-sm" data-del="${exam.id}">Sil</button>
      </div>
      <div class="stat-strip">
        <div class="stat"><b style="color:var(--dogru)">${D}</b><span>Doğru</span></div>
        <div class="stat"><b style="color:var(--yanlis)">${Y}</b><span>Yanlış</span></div>
        <div class="stat"><b style="color:var(--bos)">${B}</b><span>Boş</span></div>
        <div class="stat"><b style="color:var(--accent)">${net(D,Y).toFixed(2)}</b><span>Net</span></div>
      </div>
    </div>`;
  }).join('');
  wrap.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      DATA.exams = DATA.exams.filter(e=>e.id!==btn.dataset.del);
      await saveData();
      renderGecmis();
      showToast('Deneme silindi');
    });
  });
}

// ---------- KONULAR ----------
function renderKonular(){
  const wrap = document.getElementById('konular-subjects');
  wrap.innerHTML = DATA.subjects.map(subj=>`
    <div style="margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--grid);">
      <div class="flex-between" style="margin-bottom:10px;">
        <h3 style="font-size:14.5px;">${subj.name}</h3>
        <button class="btn btn-danger btn-sm" data-delsubj="${subj.id}">Dersi sil</button>
      </div>
      <div id="topics-${subj.id}"></div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <input type="text" placeholder="Yeni konu ekle" id="newtopic-${subj.id}">
        <button class="btn btn-ghost btn-sm" data-addtopic="${subj.id}">Ekle</button>
      </div>
    </div>`).join('');

  DATA.subjects.forEach(subj=>{
    const box = document.getElementById('topics-'+subj.id);
    box.innerHTML = subj.topics.map((t,i)=>`
      <div class="topic-edit-row">
        <input type="text" value="${t.replace(/"/g,'&quot;')}" data-subj="${subj.id}" data-idx="${i}">
        <button class="icon-x" data-rmtopic="${subj.id}" data-idx="${i}">×</button>
      </div>`).join('');
    box.querySelectorAll('input').forEach(inp=>{
      inp.addEventListener('change', async ()=>{
        subj.topics[+inp.dataset.idx] = inp.value.trim();
        await saveData();
      });
    });
    box.querySelectorAll('[data-rmtopic]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        subj.topics.splice(+btn.dataset.idx,1);
        await saveData();
        renderKonular();
      });
    });
  });

  wrap.querySelectorAll('[data-addtopic]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const input = document.getElementById('newtopic-'+btn.dataset.addtopic);
      const val = input.value.trim();
      if(!val) return;
      getSubject(btn.dataset.addtopic).topics.push(val);
      await saveData();
      renderKonular();
    });
  });
  wrap.querySelectorAll('[data-delsubj]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Bu dersi ve tüm denemelerini silmek istediğine emin misin?')) return;
      const sid = btn.dataset.delsubj;
      DATA.subjects = DATA.subjects.filter(s=>s.id!==sid);
      DATA.exams = DATA.exams.filter(e=>e.subjectId!==sid);
      await saveData();
      renderKonular();
    });
  });
}

document.getElementById('yeni-subject-btn').addEventListener('click', async ()=>{
  const input = document.getElementById('yeni-subject-name');
  const name = input.value.trim();
  if(!name) return;
  DATA.subjects.push({ id: uid(), name, topics: [] });
  await saveData();
  input.value='';
  renderKonular();
});

async function migrateData(){
  let changed = false;
  DEFAULT_DATA.subjects.forEach(defSubj=>{
    if(!DATA.subjects.find(s=>s.id===defSubj.id)){
      DATA.subjects.push(JSON.parse(JSON.stringify(defSubj)));
      changed = true;
    }
  });
  if(changed) await saveData();
}

(async function init(){
  await loadData();
  await migrateData();
  renderOzet();
})();
</script>
</body>
</html>
